services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: business_upgrade
      POSTGRES_USER: business_user
      POSTGRES_PASSWORD: change_me_locally
    ports:
      - "5432:5432"
    volumes:
      - business_upgrade_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U business_user -d business_upgrade"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  business_upgrade_postgres:
